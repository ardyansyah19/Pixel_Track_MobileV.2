name: block_star_tetris
description: A colorful, kid-friendly Tetris game with 3 difficulty levels and auto-saved high scores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
